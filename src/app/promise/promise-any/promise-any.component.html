<div class="promise-card">
  <h3>Promise.any</h3>
  <p>Returns the first fulfilled promise. If all promises reject, it rejects with an AggregateError.</p>
  <div *ngIf="result; else pending">
    <p><strong>Result:</strong> {{ result }}</p>
  </div>
  <ng-template #pending>
    <p class="text-muted">Waiting for the first promise to fulfill...</p>
  </ng-template>
  <p *ngIf="error" class="text-danger">Error: {{ error }}</p>
</div>
