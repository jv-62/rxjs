<div class="promise-card">
  <h3>Promise.race</h3>
  <p>Returns the first promise that settles, whether fulfilled or rejected.</p>
  @if (result || error) {
    @if (result) {
      <p><strong>Result:</strong> {{ result }}</p>
    }
    @if (error) {
      <p class="text-danger"><strong>Error:</strong> {{ error }}</p>
    }
  } @else {
    <p class="text-muted">Waiting for the first promise to settle...</p>
  }
</div>
