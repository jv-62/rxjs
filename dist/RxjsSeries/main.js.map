<div class="card">
  <div class="card-header">Comp 3</div>
  <div class="card-body">
    <h5 class="card-title">
      Username is <span class="text-primary">{{ userName }}</span>
    </h5>
    <input type="text" class="form-control mb-2" #uName />
    <button class="btn btn-primary" (click)="updateUserName(uName)">Change</button>
  </div>
</div>
