<div class="observable-shell">
  <div class="observable-header">
    <div>
      <h2>Observable Playground</h2>
      <p class="subtitle">Explore RxJS examples and jump back to the list whenever you need.</p>
    </div>
    <button class="btn back-btn" *ngIf="showBackButton" (click)="goBack()">← Back</button>
  </div>

  <div class="observable-content">
    <router-outlet></router-outlet>
  </div>
</div>
